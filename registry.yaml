# registry.yaml — Skill Discovery Index
#
# After May 2026 trim: this file lists only the public skills hosted in this repo
# (CMS publishing helpers + AI SEO Engine reference). The bulk of operator skills
# moved to Omnipresence (membership-only). See README for context.
#
# Raw URL: https://raw.githubusercontent.com/boshify/ai-seo-agent-skills/main/registry.yaml

repo: ai-seo-agent-skills
maintainer: Jonathan Boshoff
url: https://github.com/boshify/ai-seo-agent-skills
academy: https://www.skool.com/ai-seo
skills:
  - name: ai-seo-engine
    path: ai-seo-engine-skills/SKILL.md
    version: "1.1"
    trigger: |
      USE WHEN: creating content, refreshing content, generating topical maps, bulk importing keywords, managing SEO projects, or retrieving deliverables from Google Drive. NOT NEEDED FOR: reading pages, analyzing competitors, or publishing to CMS (use other skills).
    inputs:
      - aiseo-api-key
      - project-id
    outputs:
      - cli-output
    chains_from: []
    chains_to:
      - cms-wordpress
      - cms-webflow
      - cms-shopify
    tools_used:
      - aiseo-cli
      - mcp-server
      - gws-cli
      - curl
      - jq
    tags:
      - seo
      - content-generation
      - ai
      - cli
      - mcp
      - google-drive
  - name: cms-wordpress
    path: cms-skills/wordpress/SKILL.md
    version: "1.0"
    trigger: |
      USE WHEN: publishing or updating content on a WordPress site. Includes posts, pages, media uploads, featured images, categories, tags, and SEO metadata (Yoast/RankMath).
    inputs:
      - wordpress-url
      - wordpress-credentials
      - html-content
    outputs:
      - published-post-url
    chains_from:
      - ai-seo-engine
    chains_to: []
    tools_used:
      - curl
      - wp-cli
      - jq
    tags:
      - cms
      - wordpress
      - publishing
      - seo
  - name: cms-webflow
    path: cms-skills/webflow/SKILL.md
    version: "1.0"
    trigger: |
      USE WHEN: publishing or updating content on a Webflow site. Includes CMS collection items, rich text content, SEO metadata, and publishing state management.
    inputs:
      - webflow-api-token
      - collection-id
      - html-content
    outputs:
      - published-item-url
    chains_from:
      - ai-seo-engine
    chains_to: []
    tools_used:
      - curl
      - jq
    tags:
      - cms
      - webflow
      - publishing
      - seo
  - name: cms-shopify
    path: cms-skills/shopify/SKILL.md
    version: "1.0"
    trigger: |
      USE WHEN: publishing blog articles or pages to a Shopify store. Includes content creation, featured images, SEO metafields (title_tag, description_tag), and scheduling.
    inputs:
      - shopify-store-url
      - shopify-access-token
      - html-content
    outputs:
      - published-article-url
    chains_from:
      - ai-seo-engine
    chains_to: []
    tools_used:
      - curl
      - jq
    tags:
      - cms
      - shopify
      - publishing
      - seo
      - ecommerce
  - name: video-screenshot-extractor
    path: cms-skills/video-screenshot-extractor/SKILL.md
    version: "1.1"
    trigger: |
      USE WHEN: user provides BOTH a video source (YouTube, Vimeo, Loom, direct MP4 — any video URL or file) AND a blog post (markdown, HTML, or URL), and wants frames from the video placed into the article. Always trigger on phrases like "screenshots from the video", "frames from the recording", "proof images from the video", "stills from the video", "add images from the video/loom/youtube", "replace the embedded video with screenshots". DO NOT USE FOR: screenshots of a live webpage/dashboard with no video involved, AI-generated illustration images, video trimming or editing, audio extraction, or plain transcription. Produces full-quality PNGs with SEO EXIF, section-matched placements, and timestamp-deeplinked anchor text back to the exact second of the video.
    inputs:
      - video-url
      - blog-post
    outputs:
      - screenshots
      - modified-blog-post
      - manifest
    chains_from:
      - transcript-to-blog-post
    chains_to:
      - cms-wordpress
      - cms-webflow
      - cms-shopify
    tools_used:
      - yt-dlp
      - ffmpeg
      - exiftool
      - piexif
      - Pillow
      - python3
    tags:
      - seo
      - video
      - screenshots
      - content-pipeline
      - exif
      - youtube
      - vimeo
      - cms
